# DORMANT: this workflow uploads to the SDK Store, which is not possible
# yet (no push access, no SDKCRAFT_STORE_CREDENTIALS_* secrets, SDK not
# registered in the store). To re-enable publishing, restore the
# commented-out trigger below and configure the store credentials secrets.

name: Build and Upload SDK

on:
  # push:
  #   branches:
  #     - "[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (e.g., 1.6)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      platforms: '["amd64"]'
      platform-flag: "--build-for"
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_STAGING }}
