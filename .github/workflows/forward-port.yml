# DORMANT: forward-porting requires push access to main and the
# LONG_TERM_BRANCHES repository variable, neither of which is available
# yet. To re-enable, restore the commented-out trigger below and set
# LONG_TERM_BRANCHES (e.g. to "1.6").

name: Forward-Port from Main

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  forward-port:
    uses: canonical/sdkcraft-actions/.github/workflows/forward-port.yml@main
    with:
      long-term-branches: ${{ vars.LONG_TERM_BRANCHES }}
